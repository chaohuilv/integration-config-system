<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试执行记录</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <style>
        /* 统计卡片 */
        .stats { margin-bottom: 20px; }
        .stat-card { text-align: left; display: flex; align-items: center; gap: 14px; }
        .stat-icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        .stat-info { flex: 1; min-width: 0; }
        .stat-value { font-size: 22px; font-weight: 700; color: var(--text-primary); line-height: 1.2; }
        .stat-label { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }

        .search-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
        .search-bar select, .search-bar input { min-width: 140px; }
        .search-bar .col-flex { flex: 1; min-width: 200px; }

        .table-wrap { overflow-x: auto; }
        .table { min-width: 1100px; }

        /* 列宽 */
        .table .col-case { min-width: 160px; }
        .table .col-suite { width: 100px; }
        .table .col-status { width: 70px; }
        .table .col-steps { width: 60px; text-align: center; }
        .table .col-passed { width: 60px; text-align: center; }
        .table .col-failed { width: 60px; text-align: center; }
        .table .col-cost { width: 70px; }
        .table .col-source { width: 80px; }
        .table .col-time { width: 150px; }
        .table .col-op { width: 120px; }

        /* 来源标签 */
        .source-tag {
            display: inline-block;
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 11px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .cost-time { font-size: 12px; color: var(--text-tertiary); }
    </style>
</head>
<body>
    <div class="view-header">
        <div class="view-title">
            <h2>测试执行记录</h2>
            <p class="view-sub">查看测试用例/套件的执行历史记录</p>
        </div>
        <div class="view-actions" data-permission="test:execution:delete">
            <button class="btn btn-danger" id="btnCleanHistory" data-permission="test:execution:delete">清除历史</button>
        </div>
    </div>

    <div class="view-body">
        <!-- 统计卡片 -->
        <div class="stats">
            <div class="stat-card">
                <div class="stat-icon" style="background:#fef3c7;color:#d97706;">☀</div>
                <div class="stat-info">
                    <div class="stat-value" id="statTotal">-</div>
                    <div class="stat-label">总执行次数</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background:#dcfce7;color:#16a34a;">✓</div>
                <div class="stat-info">
                    <div class="stat-value" id="statSuccess">-</div>
                    <div class="stat-label">成功</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background:#fee2e2;color:#dc2626;">✗</div>
                <div class="stat-info">
                    <div class="stat-value" id="statFailed">-</div>
                    <div class="stat-label">失败</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background:#f3f4f6;color:#6b7280;">▶</div>
                <div class="stat-info">
                    <div class="stat-value" id="statRunning">-</div>
                    <div class="stat-label">进行中</div>
                </div>
            </div>
        </div>

        <!-- 搜索栏 -->
        <div class="search-bar">
            <select id="sSource">
                <option value="">全部来源</option>
                <option value="MANUAL">手动执行</option>
                <option value="AUTO">自动触发</option>
                <option value="SCHEDULE">定时任务</option>
                <option value="WEBHOOK">Webhook</option>
            </select>
            <select id="sStatus">
                <option value="">全部状态</option>
                <option value="PENDING">等待中</option>
                <option value="RUNNING">进行中</option>
                <option value="SUCCESS">成功</option>
                <option value="FAILED">失败</option>
                <option value="TIMEOUT">超时</option>
                <option value="SKIPPED">跳过</option>
            </select>
            <input type="text" class="search-input col-flex" id="sCaseName" placeholder="用例名称...">
            <button class="btn btn-ghost" id="btnSearch">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                搜索
            </button>
            <button class="btn btn-ghost" id="btnReset" style="color:#999;">重置</button>
        </div>

        <!-- 表格 -->
        <div class="table-wrap">
            <table class="table">
                <thead>
                    <tr>
                        <th class="col-case">用例名称</th>
                        <th class="col-suite">套件</th>
                        <th class="col-status">状态</th>
                        <th class="col-steps">步骤</th>
                        <th class="col-passed">通过</th>
                        <th class="col-failed">失败</th>
                        <th class="col-cost">耗时</th>
                        <th class="col-source">来源</th>
                        <th class="col-time">执行时间</th>
                        <th class="col-op">操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="10" class="empty"><div class="empty-icon">📭</div>加载中...</td></tr>
                </tbody>
            </table>
        </div>
        <div class="pagination" id="pagination"></div>
    </div>

    <script src="../js/vendor/jquery.min.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/components/pagination.js"></script>
    <script src="../js/components/permission.js"></script>
    <script>
    $(function() {
        let currentPage = 1;
        const size = 15;
        let pager;

        // 初始化分页组件
        pager = new Pagination('#pagination', {
            pageSize: size,
            onPageChange: function(page) {
                refreshList(page);
            }
        });

        // 初始化权限组件并检查页面访问权限
        Permission.init({ guard: true });

        // ===== 加载统计 =====
        function loadStats() {
            API.test.listExecutions({ page: 1, size: 1000 }).then(json => {
                if (json.code === 200 && json.data) {
                    const records = json.data.records || json.data.content || [];
                    let total = records.length, success = 0, failed = 0, running = 0;
                    records.forEach(r => {
                        if (r.status === 'SUCCESS') success++;
                        else if (r.status === 'FAILED') failed++;
                        else if (r.status === 'RUNNING' || r.status === 'PENDING') running++;
                    });
                    $('#statTotal').text(total);
                    $('#statSuccess').text(success);
                    $('#statFailed').text(failed);
                    $('#statRunning').text(running);
                }
            });
        }

        // ===== 刷新列表 =====
        function refreshList(page) {
            currentPage = page || 1;
            const params = {
                page: currentPage,
                size: size,
                triggerSource: $('#sSource').val() || undefined,
                status: $('#sStatus').val() || undefined,
                caseName: $('#sCaseName').val() || undefined
            };
            Object.keys(params).forEach(k => params[k] === undefined && delete params[k]);

            API.test.listExecutions(params).then(json => {
                if (json.code !== 200) { utils.toast(json.message || '查询失败', 'error'); return; }
                
                const pageData = json.data;
                if (!pageData) {
                    $('#tableBody').html('<tr><td colspan="10" class="empty"><div class="empty-icon">📭</div>暂无数据</td></tr>');
                    return;
                }
                
                const list = pageData.content || pageData.records || [];
                renderTable(list);
                pager.render(pageData, currentPage);
                loadStats();
            }).catch((err) => {
                utils.toast('加载失败: ' + (err.message || '未知错误'), 'error');
            });
        }

        // ===== 渲染表格 =====
        function renderTable(list) {
            if (!list || list.length === 0) {
                $('#tableBody').html('<tr><td colspan="10" class="empty"><div class="empty-icon">📭</div>暂无数据</td></tr>');
                return;
            }
            
            const html = list.map(item => {
                const statusBadge = getStatusBadge(item.status);
                const costTime = item.costTimeMs != null 
                    ? (item.costTimeMs < 1000 ? item.costTimeMs + 'ms' : (item.costTimeMs / 1000).toFixed(1) + 's') 
                    : '-';
                const caseName = escapeHtml(item.testCaseName || item.caseName || '-');
                const suiteName = escapeHtml(item.testSuiteName || item.suiteName || '-');
                const source = getSourceTag(item.triggerSource);
                const time = item.createdAt ? item.createdAt.replace('T', ' ').substring(0, 19) : '-';
                
                return `<tr data-id="${item.id}">
                    <td class="col-case"><a href="#" class="link-primary" onclick="viewDetail('${item.id}');return false;">${caseName}</a></td>
                    <td class="col-suite">${suiteName}</td>
                    <td class="col-status">${statusBadge}</td>
                    <td class="col-steps">${item.totalSteps || 0}</td>
                    <td class="col-passed" style="color:#16a34a">${item.passedSteps || 0}</td>
                    <td class="col-failed" style="color:#dc2626">${item.failedSteps || 0}</td>
                    <td class="col-cost"><span class="cost-time">${costTime}</span></td>
                    <td class="col-source">${source}</td>
                    <td class="col-time">${time}</td>
                    <td class="col-op">
                        <div class="actions">
                            <button class="btn btn-sm btn-default" onclick="viewDetail('${item.id}')">详情</button>
                            ${Permission.render('test:execution:delete', `<button class="btn btn-sm btn-danger" onclick="deleteRecord('${item.id}')">删除</button>`)}
                        </div>
                    </td>
                </tr>`;
            }).join('');
            $('#tableBody').html(html);
            Permission.apply();
        }

        function escapeHtml(str) {
            return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function getStatusBadge(status) {
            const map = {
                'SUCCESS': '<span class="badge badge-active">成功</span>',
                'FAILED': '<span class="badge badge-inactive">失败</span>',
                'RUNNING': '<span class="badge" style="background:#fef3c7;color:#d97706">进行中</span>',
                'PENDING': '<span class="badge" style="background:#dbeafe;color:#1d4ed8">等待</span>',
                'TIMEOUT': '<span class="badge badge-inactive">超时</span>',
                'SKIPPED': '<span class="badge" style="background:#f3f4f6;color:#6b7280">跳过</span>'
            };
            return map[status] || `<span class="badge">${status || '-'}</span>`;
        }

        function getSourceTag(source) {
            const map = {
                'MANUAL': '<span class="source-tag">手动</span>',
                'AUTO': '<span class="source-tag">自动</span>',
                'SCHEDULE': '<span class="source-tag">定时</span>',
                'WEBHOOK': '<span class="source-tag">Webhook</span>',
                'TEST_EXECUTOR': '<span class="source-tag">测试</span>'
            };
            return map[source] || `<span class="source-tag">${source || '-'}</span>`;
        }

        // ===== 搜索 & 重置 =====
        $('#btnSearch').on('click', () => refreshList(1));
        $('#btnReset').on('click', function() {
            $('#sSource').val('');
            $('#sStatus').val('');
            $('#sCaseName').val('');
            refreshList(1);
        });
        $('#sCaseName').on('keyup', e => { if (e.key === 'Enter') refreshList(1); });

        // ===== 清除历史 =====
        $('#btnCleanHistory').on('click', function() {
            utils.showConfirm('清除历史', '确定要清除所有执行历史记录吗？此操作不可恢复。', '⚠️', true).then(ok => {
                if (!ok) return;
                utils.toast('功能开发中', 'info');
            });
        });

        // ===== 查看详情 =====
        window.viewDetail = function(id) {
            parent.loadPage('test-execution-detail', { id: id });
        };

        // ===== 删除 =====
        window.deleteRecord = function(id) {
            utils.showConfirm('删除确认', '确定要删除这条执行记录吗？', '⚠️', true).then(ok => {
                if (!ok) return;
                API.test.deleteExecution(id).then(res => {
                    if (res.code === 200) {
                        utils.toast('删除成功', 'success');
                        refreshList(currentPage);
                    } else {
                        utils.toast('删除失败: ' + res.message, 'error');
                    }
                });
            });
        };

        // 初始化
        if (parent.setNav) parent.setNav('test');
        refreshList(1);
    });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统管理</title>
    <link rel="stylesheet" href="../css/components.css">
    <style>
        .page-container { padding: 24px; }
        .section-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .section-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            font-size: 15px;
        }
        .section-body {
            padding: 20px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
            text-align: center;
        }
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 4px;
        }
        .stat-label {
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .action-section {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .action-card {
            flex: 1;
            min-width: 300px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }
        .action-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .action-desc {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 16px;
            line-height: 1.5;
        }
        .action-buttons { display: flex; gap: 12px; }
        
        .btn { 
            padding: 10px 20px; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 14px;
            transition: all 0.2s;
        }

        .btn-primary:hover { opacity: 0.9; }
        .btn-secondary {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }
        .btn-secondary:hover { background: var(--border-color); }
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        .btn-danger:hover { opacity: 0.9; }
        
        .import-area {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 32px;
            text-align: center;
            margin-top: 16px;
            transition: all 0.2s;
        }
        .import-area.dragover {
            border-color: var(--primary);
            background: rgba(0, 123, 255, 0.05);
        }
        .import-area input[type="file"] { display: none; }
        .import-icon { font-size: 48px; margin-bottom: 12px; }
        .import-text { color: var(--text-secondary); margin-bottom: 12px; }
        
        .warning-box {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 6px;
            padding: 12px 16px;
            margin-top: 16px;
            font-size: 13px;
            color: #856404;
        }
        .warning-box strong { color: #721c24; }
        
        .result-box {
            margin-top: 16px;
            padding: 16px;
            border-radius: 6px;
            font-size: 13px;
        }
        .result-box.success {
            background: #d4edda;
            border: 1px solid #28a745;
            color: #155724;
        }
        .result-box.error {
            background: #f8d7da;
            border: 1px solid #dc3545;
            color: #721c24;
        }
        .result-stats { margin-top: 8px; }
        .result-stats div { padding: 4px 0; }
        
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .loading-box {
            background: white;
            padding: 32px 48px;
            border-radius: 8px;
            text-align: center;
        }
        .loading-spinner {
            width: 40px; height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="view-header">
            <h1>系统管理</h1>
        </div>
        
        <div class="view-body">
            <!-- 配置统计 -->
            <div class="section-card">
                <div class="section-header">📊 配置统计</div>
                <div class="section-body">
                    <div class="stats-grid" id="statsGrid">
                        <!-- 动态加载 -->
                    </div>
                </div>
            </div>
            
            <!-- 操作区域 -->
            <div class="section-card">
                <div class="section-header">⚙️ 备份与恢复</div>
                <div class="section-body">
                    <div class="action-section">
                        <!-- 导出 -->
                        <div class="action-card">
                            <div class="action-title">📤 导出配置</div>
                            <div class="action-desc">
                                将系统所有配置数据导出为 JSON 文件，包含接口、环境、场景、Mock、测试等全部配置。
                            </div>
                            <div class="action-buttons">
                                <button class="btn btn-primary" onclick="exportConfig()">
                                    📥 导出备份
                                </button>
                            </div>
                        </div>
                        
                        <!-- 导入 -->
                        <div class="action-card">
                            <div class="action-title">📥 导入配置</div>
                            <div class="action-desc">
                                从 JSON 备份文件恢复配置。支持清空现有数据后完整导入。
                            </div>
                            <div class="action-buttons">
                                <button class="btn btn-secondary" onclick="selectFile()">
                                    📁 选择文件
                                </button>
                                <button class="btn btn-danger" onclick="importConfig()" id="btnImport" disabled>
                                    ⚠️ 开始导入
                                </button>
                            </div>
                            
                            <div class="import-area" id="importArea">
                                <input type="file" id="fileInput" accept=".json">
                                <div class="import-icon">📄</div>
                                <div class="import-text">拖拽 JSON 备份文件到此处，或点击选择文件</div>
                                <div id="fileName" style="color: var(--primary); font-weight: 600;"></div>
                            </div>
                            
                            <div class="warning-box">
                                <strong>⚠️ 警告：</strong>导入前请确保备份文件来源可靠。导入操作会清空现有数据后重新导入。
                            </div>
                            
                            <div id="resultBox" style="display: none;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 加载中遮罩 -->
    <div class="loading-overlay" id="loadingOverlay" style="display: none;">
        <div class="loading-box">
            <div class="loading-spinner"></div>
            <div id="loadingText">处理中...</div>
        </div>
    </div>

    <script src="../js/vendor/jquery.min.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/components/pagination.js"></script>
    <script src="../js/components/permission.js"></script>
    <script>
        // 统计数据映射
        const STAT_LABELS = {
            menus: '菜单',
            permissions: '权限',
            roles: '角色',
            users: '用户',
            apiConfigs: '接口配置',
            environments: '环境配置',
            scenarios: '场景编排',
            scenarioSteps: '场景步骤',
            mockConfigs: 'Mock配置',
            alertRules: '告警规则',
            ipWhitelistRules: 'IP白名单',
            testCases: '测试用例',
            testCaseSteps: '用例步骤',
            testSuites: '测试套件',
            testSuiteCases: '套件关联'
        };
        
        let selectedFile = null;
        
        $(function() {
            Permission.init({ guard: true });
            loadStats();
            initDragDrop();
        });
        
        // 加载统计数据
        function loadStats() {
            $.ajax({
                url: '/api/backup/stats',
                method: 'GET',
                headers: { 'Authorization': 'Bearer ' + localStorage.getItem('integration_access_token') },
                success: function(res) {
                    if (res.code === 200 && res.data) {
                        renderStats(res.data);
                    }
                },
                error: function() {
                    $('#statsGrid').html('<div style="color: var(--text-secondary);">加载统计失败</div>');
                }
            });
        }
        
        function renderStats(stats) {
            let html = '';
            for (let key in STAT_LABELS) {
                let value = stats[key] || 0;
                html += `
                    <div class="stat-card">
                        <div class="stat-value">${value}</div>
                        <div class="stat-label">${STAT_LABELS[key]}</div>
                    </div>
                `;
            }
            $('#statsGrid').html(html);
        }
        
        // 导出配置
        function exportConfig() {
            showLoading('正在生成备份文件...');
            const token = localStorage.getItem('integration_access_token');
            fetch('/api/backup/export', {
                headers: { 'Authorization': 'Bearer ' + token }
            }).then(res => {
                if (!res.ok) throw new Error('导出失败');
                return res.blob();
            }).then(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'config-backup-' + new Date().toISOString().slice(0, 10) + '.json';
                a.click();
                URL.revokeObjectURL(url);
                hideLoading();
                Utils.toast('导出成功', 'success');
            }).catch(err => {
                hideLoading();
                Utils.toast('导出失败: ' + err.message, 'error');
            });
        }
        
        // 选择文件
        function selectFile() {
            $('#fileInput').click();
        }
        
        // 文件选择处理
        $('#fileInput').change(function(e) {
            const file = e.target.files[0];
            if (file) {
                if (!file.name.endsWith('.json')) {
                    Utils.toast('请选择 JSON 格式的备份文件', 'error');
                    return;
                }
                selectedFile = file;
                $('#fileName').text('已选择: ' + file.name);
                $('#btnImport').prop('disabled', false);
                $('#resultBox').hide();
            }
        });
        
        // 拖拽上传
        function initDragDrop() {
            const area = $('#importArea')[0];
            
            area.addEventListener('dragover', function(e) {
                e.preventDefault();
                $(this).addClass('dragover');
            });
            
            area.addEventListener('dragleave', function(e) {
                e.preventDefault();
                $(this).removeClass('dragover');
            });
            
            area.addEventListener('drop', function(e) {
                e.preventDefault();
                $(this).removeClass('dragover');
                
                const file = e.dataTransfer.files[0];
                if (file) {
                    if (!file.name.endsWith('.json')) {
                        Utils.toast('请选择 JSON 格式的备份文件', 'error');
                        return;
                    }
                    selectedFile = file;
                    $('#fileName').text('已选择: ' + file.name);
                    $('#btnImport').prop('disabled', false);
                    $('#resultBox').hide();
                }
            });
            
            area.addEventListener('click', function() {
                $('#fileInput').click();
            });
        }
        
        // 导入配置
        function importConfig() {
            if (!selectedFile) {
                Utils.toast('请先选择备份文件', 'error');
                return;
            }
            
            if (!confirm('⚠️ 确认导入？\n\n导入操作将清空现有所有配置数据！\n建议先导出当前配置作为备份。')) {
                return;
            }
            
            if (!confirm('再次确认：即将清空所有配置并导入新数据！')) {
                return;
            }
            
            showLoading('正在导入配置，请稍候...');
            
            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('clearExisting', 'true');
            
            $.ajax({
                url: '/api/backup/import',
                type: 'POST',
                headers: { 'Authorization': 'Bearer ' + localStorage.getItem('integration_access_token') },
                data: formData,
                processData: false,
                contentType: false,
                success: function(res) {
                    hideLoading();
                    if (res.code === 0) {
                        showResult('success', '导入成功！耗时: ' + res.data.costMs + 'ms', res.data.counts);
                        loadStats();
                    } else {
                        showResult('error', '导入失败: ' + res.message);
                    }
                },
                error: function(xhr) {
                    hideLoading();
                    let msg = '导入失败';
                    try {
                        const res = JSON.parse(xhr.responseText);
                        msg = res.message || msg;
                    } catch(e) {}
                    showResult('error', msg);
                }
            });
        }
        
        function showResult(type, message, counts) {
            let html = '<div class="result-box ' + type + '">' + message;
            if (counts) {
                html += '<div class="result-stats">';
                for (let key in counts) {
                    html += '<div>' + (STAT_LABELS[key] || key) + ': ' + counts[key] + ' 条</div>';
                }
                html += '</div>';
            }
            html += '</div>';
            $('#resultBox').html(html).show();
        }
        
        function showLoading(text) {
            $('#loadingText').text(text || '处理中...');
            $('#loadingOverlay').show();
        }
        
        function hideLoading() {
            $('#loadingOverlay').hide();
        }
    </script>
</body>
</html>
